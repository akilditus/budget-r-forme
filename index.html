<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tableau de bord de la réforme budgétaire</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'DM Sans',sans-serif;background:#e9decd;color:#1c1917;padding:24px;line-height:1.6}
.mx{max-width:1100px;margin:0 auto}
h1{font-size:2.2rem;font-weight:600;color:#0c0a09;letter-spacing:-0.5px;margin-bottom:8px}
.card{background:#f5f5f4;border:1px solid #d6d3d1;border-radius:20px;padding:20px;margin-bottom:16px}
.card-t{font-size:1rem;font-weight:600;color:#0c0a09;margin-bottom:4px}
.card-d{font-size:.8rem;color:#57534e;margin-bottom:12px}
.slider-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-bottom:8px}
.slider-box{background:#f5efe6;border:1px solid #d6d3d1;border-radius:14px;padding:12px}
.slider-box label{display:flex;justify-content:space-between;font-size:.8rem;color:#57534e;margin-bottom:6px}
.slider-box label b{color:#0c0a09}
input[type=range]{width:100%;accent-color:#0891b2;height:4px;margin-top:4px}
.kpi-bar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
.kpi-bar>div{text-align:center;flex:1;min-width:120px}
.kpi-bar .kl{font-size:.65rem;text-transform:uppercase;letter-spacing:1.5px;color:#78716c}
.kpi-bar .kv{font-size:1.6rem;font-weight:700}
.kpi-bar .kv.pos{color:#047857}.kpi-bar .kv.neg{color:#be123c}
.kpi-sep{width:1px;height:36px;background:#d6d3d1}
.tabs{display:flex;gap:4px;background:#f5f5f4;border:1px solid #d6d3d1;border-radius:14px;padding:4px;margin-bottom:16px;flex-wrap:wrap}
.tab{padding:8px 16px;border-radius:10px;font-size:.8rem;cursor:pointer;border:none;background:transparent;color:#57534e}
.tab.active{background:#292524;color:#fff}
.tab-content{display:none}.tab-content.active{display:block}
.family{border:2px solid;border-radius:20px;padding:14px;margin-bottom:14px}
.family.f1{border-color:#fbbf24;background:#fffbeb}.family.f2{border-color:#a78bfa;background:#f5f3ff}
.family.f3{border-color:#60a5fa;background:#eff6ff}.family.f4{border-color:#4ade80;background:#f0fdf4}
.fam-head{display:flex;justify-content:space-between;align-items:center;padding-bottom:8px;border-bottom:1px solid rgba(0,0,0,.08);margin-bottom:8px}
.fam-title{font-weight:700;font-size:.9rem}.fam-sub{font-size:.7rem;color:#78716c}
.f1 .fam-title{color:#92400e}.f2 .fam-title{color:#5b21b6}.f3 .fam-title{color:#1e40af}.f4 .fam-title{color:#166534}
.pillar{background:#f5f5f4;border:1px solid #d6d3d1;border-radius:14px;margin-bottom:6px;overflow:hidden}
.pillar-head{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;cursor:pointer;transition:background .15s}
.pillar-head:hover{background:rgba(0,0,0,.03)}
.pillar-head .dot{width:8px;height:8px;border-radius:2px;flex-shrink:0}
.pillar-head .pt{font-size:.82rem;font-weight:600;color:#0c0a09}
.pillar-head .pn{font-size:.85rem;font-weight:600}
.pillar-head .arrow{width:14px;height:14px;transition:transform .2s;color:#a8a29e}
.pillar-body{padding:6px 14px 10px;display:none}
.pillar.open .pillar-body{display:block}
.pillar.open .arrow{transform:rotate(180deg)}
.measure{display:flex;justify-content:space-between;gap:12px;background:#f5efe6;border:1px solid #e7e5e4;border-radius:10px;padding:10px;margin-bottom:4px;flex-wrap:wrap}
.measure .ml{font-size:.8rem;font-weight:600;color:#0c0a09}
.measure .mn{font-size:.7rem;color:#78716c;margin-top:2px;line-height:1.5}
.measure .mv{text-align:right;min-width:100px;flex-shrink:0}
.measure .mv .tag{font-size:.6rem;text-transform:uppercase;letter-spacing:1px;color:#a8a29e}
.measure .mv .val{font-size:1rem;font-weight:600}
.pos{color:#047857}.neg{color:#be123c}.dyn{color:#1d4ed8}
.salary-table{width:100%;border-collapse:collapse;font-size:.8rem;margin-bottom:12px}
.salary-table th{text-align:right;font-size:.7rem;color:#78716c;padding:6px 8px;border-bottom:1px solid #a5f3fc}
.salary-table th:first-child{text-align:left}
.salary-table td{padding:8px;border-bottom:1px solid #e7e5e4}
.salary-table td:not(:first-child){text-align:right}
.salary-table tr.total{background:rgba(6,182,212,.08)}
.salary-table tr.total td{font-weight:700;color:#0e7490;font-size:.9rem}
.synth-card{border:2px solid;border-radius:20px;padding:16px;margin-bottom:12px}
.synth-card.s1{border-color:#fbbf24;background:#fffbeb}.synth-card.s2{border-color:#a78bfa;background:#f5f3ff}
.synth-card.s3{border-color:#60a5fa;background:#eff6ff}.synth-card.s4{border-color:#4ade80;background:#f0fdf4}
.synth-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px}
.synth-head .st{font-weight:700;font-size:.9rem}.synth-desc{font-size:.75rem;color:#57534e;margin-bottom:8px}
.bar-wrap{height:6px;background:#e7e5e4;border-radius:3px;overflow:hidden;margin-top:6px}
.bar-fill{height:100%;background:#059669;border-radius:3px;transition:width .3s}
.method-box{background:#f5efe6;border:1px solid #d6d3d1;border-radius:14px;padding:16px;margin-bottom:12px;font-size:.8rem;line-height:1.8;color:#44403c}
.method-box strong{color:#0c0a09}
.csg-card{background:#ecfeff;border:2px solid #a5f3fc;border-radius:20px;padding:16px;margin-bottom:12px}
.csg-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:8px}
.csg-item{background:rgba(255,255,255,.6);border:1px solid #a5f3fc;border-radius:12px;padding:10px}
.csg-item .cp{font-size:.7rem;color:#78716c}.csg-item .cg{font-size:1.2rem;font-weight:700;color:#0e7490}
.csg-item .ca{font-size:.7rem;color:#78716c}
.proj-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.proj-box{border-radius:14px;padding:14px;border:1px solid}
.proj-box.p5{background:#ecfeff;border-color:#a5f3fc}.proj-box.p10{background:#f5f3ff;border-color:#c4b5fd}
.filter-bar{display:flex;gap:6px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.fbtn{padding:4px 12px;border-radius:20px;border:1px solid #d6d3d1;background:#f5f5f4;font-size:.7rem;cursor:pointer;color:#57534e}
.fbtn.active{background:#292524;color:#fff;border-color:#292524}
@media(max-width:600px){h1{font-size:1.5rem}.kpi-sep{display:none}.proj-grid{grid-template-columns:1fr}.salary-table{font-size:.7rem}}
</style>
</head>

<script>
const lerp=(v,t)=>Array.isArray(v)?v[0]+(v[1]-v[0])*t:v||0;
const euro=n=>`${n>0?"+":n<0?"–":""}${Math.abs(n).toFixed(1)} Md€`;
const fmt=n=>`${n.toFixed(1)} Md€`;
const DECILES=[0,850,1150,1400,1650,1950,2250,2650,3300,5600];
const STATUS=[{w:.293,r:.707},{w:.364,r:.636},{w:.438,r:.562},{w:.507,r:.493},{w:.561,r:.439},{w:1,r:0},{w:1,r:0},{w:1,r:0},{w:1,r:0},{w:1,r:0}];
const socleCost=(s,wr,rr)=>{let g=0;for(let i=0;i<10;i++){const inc=DECILES[i],st=STATUS[i];g+=(st.w*Math.max(0,s-inc*wr/100)+st.r*Math.max(0,s-inc*rr/100))*12*(47.8/10)}return g*.75/1e3};
const retCapGain=c=>Math.max(0,25*Math.max(0,Math.min(1,(4000-c)/1500)));
const retAgeGain=a=>(a-64)*3;
const enfCost=m=>(12.5*m*12*.85)/1e3;
const csgCost=p=>p*10;
const csgDyn=(p,m,rr,wr)=>p*lerp([1,2.5],m)+Math.max(0,rr-wr)*.05*(.6+m);
const housingCost=a=>{if(a<=0)return 0;return(5.5*.6*a*.58+5.5*.4*a*.62)*12/1e3};

const FAMILIES=[
{name:"Simplification sociale et filet universel",cls:"f1 s1",keys:["social","famille","logement_aide","aides","chomage"]},
{name:"Réforme de l'État et des institutions",cls:"f2 s2",keys:["institutions","admin","collectivites","education","fraude","desengagement"]},
{name:"Compétitivité et fiscalité",cls:"f3 s3",keys:["marche","entreprises","capital","csg","logement","retraites"]},
{name:"Libéralisation sectorielle",cls:"f4 s4",keys:["agriculture","pharmacie","franchise","rgpd","ferro"]}

let P={exec:35,macro:25,infl:2,socle:720,wr:42,rr:50,csg:2,child:100,retCap:2500,retAge:64,housing:200};
let filter="all",expanded={},activeTab="synthese";

function compute(){
  const aT=P.exec/100,mT=P.macro/100;
  const cats=CATS.map(cat=>{
    let sT=0,cT=0;
    const rows=cat.items.map(it=>{
      let sv=0,co=0;
      if(it.s==="retCap")sv=retCapGain(P.retCap);
      else if(it.s==="retAge")sv=retAgeGain(P.retAge);
      else if(it.s==="csgDyn")sv=csgDyn(P.csg,mT,P.rr,P.wr);
      else sv=it.t==="d"?lerp(it.s,mT):lerp(it.s,aT);
      if(it.c==="socle")co=socleCost(P.socle,P.wr,P.rr);
      else if(it.c==="child")co=enfCost(P.child);
      else if(it.c==="csg")co=csgCost(P.csg);
      else if(it.c==="housing")co=housingCost(P.housing);
      else co=it.t==="d"?lerp(it.c,mT):lerp(it.c,aT);
      sT+=sv;cT+=co;
      return{...it,sv,co,net:sv-co};
    });
    const str=rows.filter(r=>r.t==="s").reduce((a,r)=>a+r.sv,0);
    const dyn=rows.filter(r=>r.t==="d").reduce((a,r)=>a+r.sv,0);
    return{...cat,rows,sT,cT,net:sT-cT,str,dyn};
  });
  const savings=cats.reduce((a,c)=>a+c.sT,0);
  const costs=cats.reduce((a,c)=>a+c.cT,0);
  const str=cats.reduce((a,c)=>a+c.str,0);
  const dyn=cats.reduce((a,c)=>a+c.dyn,0);
  return{cats,savings,costs,net:savings-costs,str,dyn};
}

function renderKPIs(r){
  document.getElementById("kpis").innerHTML=`<div class="kpi-bar"><div><div class="kl">Économies + effets dynamiques</div><div class="kv pos">${euro(r.savings)}</div></div><div class="kpi-sep"></div><div><div class="kl">Coûts et baisses</div><div class="kv neg">${euro(-r.costs)}</div></div><div class="kpi-sep"></div><div><div class="kl">Bilan net</div><div class="kv ${r.net>=0?"pos":"neg"}">${euro(r.net)}</div></div></div>`;
}

function renderDecomp(r){
  const pct=(v,tot)=>Math.min(100,v/Math.max(1,tot)*100);
  document.getElementById("decomposition").innerHTML=`<div class="card-t">Décomposition du solde</div>
  <div style="margin-top:10px"><div style="display:flex;justify-content:space-between;font-size:.8rem"><span>Structurelles</span><span class="pos">${fmt(r.str)}</span></div><div class="bar-wrap"><div class="bar-fill" style="width:${pct(r.str,r.savings)}%;background:#059669"></div></div></div>
  <div style="margin-top:8px"><div style="display:flex;justify-content:space-between;font-size:.8rem"><span>Dynamiques</span><span class="dyn">${fmt(r.dyn)}</span></div><div class="bar-wrap"><div class="bar-fill" style="width:${pct(r.dyn,r.savings)}%;background:#2563eb"></div></div></div>
  <div style="margin-top:8px"><div style="display:flex;justify-content:space-between;font-size:.8rem"><span>Coûts</span><span class="neg">${fmt(r.costs)}</span></div><div class="bar-wrap"><div class="bar-fill" style="width:${pct(r.costs,r.savings+r.costs)}%;background:#be123c"></div></div></div>`;
}

function renderSynthese(r){
  const pts=P.csg;
  const profiles=[{l:"SMIC (1 426 €)",b:1426},{l:"Médian (2 180 €)",b:2180},{l:"3 SMIC (4 278 €)",b:4278}];
  const ch=profiles.map(p=>{
    const cg=Math.round(p.b*pts*.98/100),pl=Math.round(p.b*.019),ph=Math.round(p.b*.048),
    tl=Math.round(p.b*.007*5),th=Math.round(p.b*.016*5);
    return{...p,cg,pl,ph,tl,th,totL:cg+pl+tl,totH:cg+ph+th};
  });
  let h=`<div class="csg-card"><div class="card-t" style="color:#0e7490">Impact sur les salaires nets — estimation à 5 ans</div><div class="card-d">Hors effet d'inflation (gains en euros constants)</div>
  <table class="salary-table"><thead><tr><th>Canal</th>${ch.map(c=>`<th>${c.l}</th>`).join("")}</tr></thead><tbody>
  <tr><td><b>CSG −${pts.toFixed(1)} pts</b><br><span style="font-size:.65rem;color:#78716c">Immédiat</span></td>${ch.map(c=>`<td style="font-weight:600;color:#0e7490">+${c.cg} €</td>`).join("")}</tr>
  <tr><td><b>Charges patronales</b><br><span style="font-size:.65rem;color:#78716c">3-5 ans (IP → 1,5 % PIB)</span></td>${ch.map(c=>`<td>${c.pl}–${c.ph} €</td>`).join("")}</tr>
  <tr><td><b>Tension marché</b><br><span style="font-size:.65rem;color:#78716c">Chômage + immigration</span></td>${ch.map(c=>`<td>${c.tl}–${c.th} €</td>`).join("")}</tr>
  <tr class="total"><td>Total à 5 ans</td>${ch.map(c=>`<td>+${c.totL}–${c.totH} €/mois</td>`).join("")}</tr>
  </tbody></table></div>`;
  FAMILIES.forEach(fam=>{
    const fc=fam.keys.map(k=>r.cats.find(c=>c.key===k)).filter(Boolean);
    const sv=fc.reduce((a,c)=>a+c.sT,0),co=fc.reduce((a,c)=>a+c.cT,0),net=sv-co;
    h+=`<div class="synth-card ${fam.cls.split(" ")[1]}"><div class="synth-head"><div class="st">${fam.name}</div><div class="${net>=0?"pos":"neg"}" style="font-size:1.1rem;font-weight:700">${euro(net)}</div></div>
    <div style="display:flex;gap:16px;font-size:.8rem"><span style="color:#78716c">Économies : <span class="pos">${fmt(sv)}</span></span><span style="color:#78716c">Coûts : <span class="neg">${fmt(co)}</span></span></div>
    <div class="bar-wrap"><div class="bar-fill" style="width:${co>0?sv/(sv+co)*100:100}%"></div></div></div>`;
  });
  document.getElementById("tab-synthese").innerHTML=h;
}

function renderMeasures(r){
  let h=`<div class="filter-bar"><span style="font-size:.75rem;color:#57534e">Filtrer :</span>
  ${[["all","Tout"],["positive","Net positif"],["negative","Net négatif"]].map(([k,l])=>`<button class="fbtn ${filter===k?"active":""}" onclick="filter='${k}';update()">${l}</button>`).join("")}
  <button class="fbtn" style="margin-left:auto" onclick="expanded=Object.keys(expanded).length>10?{}:Object.fromEntries(CATS.map(c=>[c.key,true]));update()">Tout déplier/replier</button></div>`;
  FAMILIES.forEach(fam=>{
    const fc=fam.keys.map(k=>r.cats.find(c=>c.key===k)).filter(Boolean).filter(c=>filter==="all"||(filter==="positive"?c.net>=0:c.net<0));
    if(!fc.length)return;
    const sv=fc.reduce((a,c)=>a+c.sT,0),co=fc.reduce((a,c)=>a+c.cT,0),net=sv-co;
    h+=`<div class="family ${fam.cls.split(" ")[0]}"><div class="fam-head"><div><div class="fam-title">${fam.name}</div><div class="fam-sub">${fc.length} piliers · ${fc.reduce((a,c)=>a+c.rows.length,0)} mesures</div></div><div class="${net>=0?"pos":"neg"}" style="font-size:1.1rem;font-weight:700">${euro(net)}</div></div>`;
    fc.forEach(cat=>{
      const op=expanded[cat.key]?"open":"";
      h+=`<div class="pillar ${op}"><div class="pillar-head" onclick="expanded['${cat.key}']=!expanded['${cat.key}'];update()"><div style="display:flex;align-items:center;gap:8px"><div class="dot" style="background:${cat.tone}"></div><span class="pt">${cat.title}</span><span style="font-size:.7rem;color:#a8a29e">${cat.rows.length}</span></div><div style="display:flex;align-items:center;gap:8px"><span class="pn ${cat.net>=0?"pos":"neg"}">${euro(cat.net)}</span><svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 9l-7 7-7-7"/></svg></div></div>`;
      if(expanded[cat.key]){
        h+=`<div class="pillar-body">`;
        cat.rows.forEach(row=>{
          h+=`<div class="measure"><div style="flex:1"><div class="ml">${row.l}</div>${row.n?`<div class="mn">${row.n}</div>`:""}</div><div class="mv">`;
          h+=`<div class="tag">Net</div><div class="val ${row.net>=0?"pos":"neg"}">${euro(row.net)}</div>`;
          if(row.co>0.05)h+=`<div class="tag">Coût</div><div class="val neg" style="font-size:.85rem">–${row.co.toFixed(1)} Md€</div>`;
          if(row.sv>0.05)h+=`<div class="tag">${row.t==="d"?"Dynamique":"Économie"}</div><div class="val ${row.t==="d"?"dyn":"pos"}" style="font-size:.85rem">+${row.sv.toFixed(1)} Md€</div>`;
          h+=`</div></div>`;
        });
        h+=`</div>`;
      }
      h+=`</div>`;
    });
    h+=`</div>`;
  });
  document.getElementById("tab-measures").innerHTML=h;
}

function renderMethod(){
  document.getElementById("tab-method").innerHTML=`<div class="card"><div class="method-box"><p><strong>Sources mobilisées.</strong> Insee, DREES, Unédic, Banque de France, OCDE (Taxing Wages, Government at a Glance, Panorama des administrations), Rexecode, Cour des comptes (dépenses fiscales, emploi public), rapports sénatoriaux, France Stratégie, IGF, IGAS, Conseil d'orientation des retraites (COR), Conseil national d'évaluation des politiques d'innovation (CNEPI), Institut des politiques publiques (IPP), DGFiP, Insee-Douanes (commerce extérieur agroalimentaire).</p><p><strong>Approche.</strong> Micro-simulation décile par décile, fourchettes structurelles, effets dynamiques prudents. Taux de retrait distincts travail / remplacement. CSG paramétrable de 0 à 3 pts avec effet dynamique borné. Socle réindexé dans les projections à 5 et 10 ans.</p><p><strong>Références intellectuelles et empiriques.</strong> Architecture : Hayek (filet simple), Eucken (règles lisibles), OCDE/FMI (neutralité fiscale). Pour le bornage des effets dynamiques, choix délibéré d'appuis non libéraux pour ne pas surestimer les retours d'assiette : <strong>Piketty-Saez-Stantcheva 2014</strong> (capital, conclusions minorantes) · <strong>Kleven 2014</strong> (IP, effets conditionnels) · <strong>Zucman 2024</strong> (simplification &gt; taux) · <strong>RAND HIE</strong> (franchise médicale — co-paiement réduit utile et inutile) · <strong>France Stratégie &amp; CNEPI</strong> (CICE et CIR — transmission lente, effet d'aubaine élevé chez les grands groupes) · <strong>Cahuc-Kramarz</strong> et <strong>OCDE EPL</strong> (contrat unique, +1-2 % d'emploi) · <strong>Cette, L'Horty, Askenazy</strong> (SMIC modulable, 100-300k postes) · <strong>Fack 2006</strong> et <strong>Grislain-Letremy &amp; Trevien 2014</strong> (capture des APL par les bailleurs, 50-80 %) · <strong>COR</strong> (~3 Md€/an de recul d'âge effectif) · <strong>Cour des comptes</strong> (chiffrage annuel des niches, 95 Mds en 2024). Ce parti pris garantit que même un sceptique de l'offre peut considérer les fourchettes basses comme crédibles.</p></div><div class="method-box"><p><strong>Formules.</strong></p><p><strong>Socle</strong> = max(0, montant − taux × revenu).</p><p><strong>Famille</strong> = 12,5M enfants × majoration × 12 × 0,85.</p><p><strong>CSG</strong> ≈ pts × ~10 Md€/pt (assiette hors retraites).</p><p><strong>Désindexation pensions</strong> : part ≤ SMIC à inflation −1 pt ; part &gt; SMIC gelée. Chiffrage en régime permanent à 5 ans.</p><p><strong>Âge retraite</strong> : ±3 Md€/an d'écart avec 64 ans (COR). Symétrie simplifiée.</p><p><strong>Salaires</strong> : CSG 100 % immédiat. Charges patronales 25-50 % à 3-5 ans. Tension marché +0,3-0,8 %/an par pt de chômage en moins.</p></div></div>`;
}

function renderLimits(){
  document.getElementById("tab-limits").innerHTML=`<div class="card"><div class="method-box"><p>Les principales limites tiennent au risque de double comptage résiduel, à la sensibilité des fourchettes dynamiques au contexte macroéconomique et à l'écart entre simplification institutionnelle et économies effectivement encaissées à court terme.</p><p>La composition par décile reste une approximation structurée et non une maquette administrative exhaustive.</p></div></div>`;
}

function renderTabs(){
  const tabs=[["synthese","Synthèse"],["measures","Mesures"],["method","Méthode"],["limits","Limites"]];
  document.getElementById("tabbar").innerHTML=tabs.map(([k,l])=>`<button class="tab ${activeTab===k?"active":""}" onclick="activeTab='${k}';update()">${l}</button>`).join("");
  tabs.forEach(([k])=>{document.getElementById("tab-"+k).classList.toggle("active",activeTab===k)});
}

function initControls(){
  const ctrls=[
    ["Exécution","exec",P.exec,0,100,1,"","parseInt"],
    ["Crédibilité macro","macro",P.macro,0,100,1,"","parseInt"],
    ["Inflation","infl",P.infl,0,4,0.1," %","parseFloat"],
    ["Socle","socle",P.socle,500,900,10," €","parseInt"],
    ["Retrait travail","wr",P.wr,25,50,1," %","parseInt"],
    ["Retrait remplacement","rr",P.rr,30,60,1," %","parseInt"],
    ["Baisse CSG actifs","csg",P.csg,0,3,0.1," pts","parseFloat"],
    ["Majoration enfant (socle)","child",P.child,100,300,10," €","parseInt"],
    ["Plafond retraite","retCap",P.retCap,2000,4000,100," €","parseInt"],
    ["Âge retraite","retAge",P.retAge,62,67,1," ans","parseInt"],
    ["Aide logement max","housing",P.housing,0,350,10," €/mois","parseInt"]
  ];
  let h='<div class="card-t">Paramètres de simulation</div><div class="slider-row">';
  ctrls.forEach(([label,key,val,min,max,step,unit,parse])=>{
    h+=`<div class="slider-box"><label><span>${label}</span><b id="v_${key}"></b></label><input type="range" id="sl_${key}" min="${min}" max="${max}" step="${step}" value="${val}"></div>`;
  });
  h+='</div>';
  document.getElementById("controls").innerHTML=h;
  ctrls.forEach(([label,key,val,min,max,step,unit,parse])=>{
    const sl=document.getElementById("sl_"+key);
    sl.addEventListener("input",function(){
      P[key]=window[parse](this.value);
      update();
    });
  });
}

function updateSliderLabels(){
  document.getElementById("v_exec").textContent=P.exec;
  document.getElementById("v_macro").textContent=P.macro;
  document.getElementById("v_infl").textContent=P.infl.toFixed(1)+" %";
  document.getElementById("v_socle").textContent=P.socle+" €";
  document.getElementById("v_wr").textContent=P.wr+" %";
  document.getElementById("v_rr").textContent=P.rr+" %";
  document.getElementById("v_csg").textContent=P.csg.toFixed(1)+" pts";
  document.getElementById("v_child").textContent=P.child+" €";
  document.getElementById("v_retCap").textContent=P.retCap+" €";
  document.getElementById("v_retAge").textContent=P.retAge+" ans";
  document.getElementById("v_housing").textContent=P.housing+" €/mois";
}

function update(){
  const r=compute();
  updateSliderLabels();
  renderKPIs(r);renderDecomp(r);renderTabs();
  renderSynthese(r);renderMeasures(r);renderMethod();renderLimits();
}

initControls();
update();
</script>
